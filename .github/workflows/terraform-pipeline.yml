# .github/workflows/terraform-pipeline.yml
name: Terraform CI

on:
  workflow_dispatch: {}
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_DIR: envs/dev-aws
  TF_VERSION: "1.11.0"

jobs:
  fmt-lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt (vérification uniquement, ne corrige rien ici)
        run: terraform -chdir=${{ env.TF_DIR }} fmt -check -recursive

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: Run tflint
        run: |
          tflint --chdir=${{ env.TF_DIR }} --init
          tflint --chdir=${{ env.TF_DIR }} --minimum-failure-severity=error

  security:
    name: Security (gitleaks + trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            -o /tmp/gitleaks.tar.gz
          sudo tar xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan secrets (historique complet)
        run: gitleaks detect --source . --verbose --redact

      - name: Scan misconfigurations Terraform (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ env.TF_DIR }}
          severity: HIGH,CRITICAL
          exit-code: 1
          trivyignores: ${{ env.TF_DIR }}/.trivyignore

  plan:
    name: Terraform Plan
    needs: [fmt-lint, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: terraform -chdir=${{ env.TF_DIR }} init

      - name: Terraform validate
        run: terraform -chdir=${{ env.TF_DIR }} validate

      - name: Terraform plan
        env:
          TF_VAR_my_ip: ${{ secrets.MY_IP }}
        run: terraform -chdir=${{ env.TF_DIR }} plan -input=false -out=tfplan -no-color

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 5

  apply:
    name: Terraform Apply
    needs: plan
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: terraform -chdir=${{ env.TF_DIR }} init

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: ${{ env.TF_DIR }}

      - name: Terraform apply (applique exactement le plan approuvé)
        run: terraform -chdir=${{ env.TF_DIR }} apply -input=false tfplan

  deploy-html:
    name: Deploy HTML (Ansible)
    needs: apply
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init (pour lire l'output)
        run: terraform -chdir=${{ env.TF_DIR }} init

      - name: Récupérer l'IP publique de l'instance
        id: get_ip
        run: |
          IP=$(terraform -chdir=${{ env.TF_DIR }} output -raw instance_public_ip)
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Installer Ansible
        run: pip install ansible

      - name: Préparer la clé privée SSH
        run: |
          echo "${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}" > /tmp/ansible_key
          chmod 600 /tmp/ansible_key

      - name: Générer l'inventaire dynamique
        run: |
          echo "[webservers]" > ansible/inventory.ini
          echo "${{ steps.get_ip.outputs.ip }} ansible_user=ubuntu ansible_ssh_private_key_file=/tmp/ansible_key ansible_ssh_common_args='-o StrictHostKeyChecking=no'" >> ansible/inventory.ini

      - name: Attendre que SSH soit prêt
        run: |
          for i in $(seq 1 20); do
            if nc -z -w2 ${{ steps.get_ip.outputs.ip }} 22; then
              echo "SSH prêt"
              exit 0
            fi
            echo "SSH pas encore prêt, nouvelle tentative dans 5s..."
            sleep 5
          done
          echo "SSH toujours indisponible après 100s"
          exit 1

      - name: Lancer le playbook Ansible
        run: ansible-playbook -i ansible/inventory.ini ansible/playbook.yml
