---
- name: Déployer la page d'accueil sur le serveur web
  hosts: webservers
  become: true
  tasks:
    - name: Attendre la fin de cloud-init (tolère un statut d'erreur, on veut juste qu'il ait terminé)
      command: cloud-init status --wait
      register: cloudinit_result
      changed_when: false
      failed_when: false

    - name: Mettre à jour le cache apt
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Installer nginx
      apt:
        name: nginx
        state: present

    - name: Copier index.html dans le webroot nginx
      copy:
        src: index.html
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: "0644"

    - name: S'assurer que nginx est démarré et activé
      service:
        name: nginx
        state: started
        enabled: true
