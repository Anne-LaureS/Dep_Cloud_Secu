---
- name: Déployer la page d'accueil sur le serveur web
  hosts: webservers
  become: true
  tasks:
    - name: Copier index.html dans le webroot nginx
      copy:
        src: index.html
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: "0644"

    - name: S'assurer que nginx est démarré
      service:
        name: nginx
        state: started
        enabled: true
